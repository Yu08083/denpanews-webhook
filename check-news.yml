name: Check Denpa News

on:
  schedule:
    # 通常監視: 毎時5分 (UTC) = 毎時14分 (JST)
    - cron: '5 * * * *'
    # 集中監視 1: JST 10:57 = UTC 01:57
    - cron: '57 1 * * *'
    # 集中監視 2: JST 14:57 = UTC 05:57
    - cron: '57 5 * * *'
  workflow_dispatch:
    inputs:
      intensive:
        description: '集中監視モード(1分間隔×4回)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: denpa-news-bot
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine intensive mode
        id: mode
        run: |
          if [ "${{ inputs.intensive }}" = "true" ]; then
            echo "intensive=1" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "57 1 * * *" ] \
            || [ "${{ github.event.schedule }}" = "57 5 * * *" ]; then
            echo "intensive=1" >> $GITHUB_OUTPUT
          else
            echo "intensive=0" >> $GITHUB_OUTPUT
          fi

      - name: Determine site URL
        id: site
        run: |
          # GitHub Pages のURLを自動算出 (例: https://yu08083.github.io/denpanews-webhook)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          echo "url=https://${OWNER}.github.io/${REPO}" >> $GITHUB_OUTPUT

      - name: Run runner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_BASE_URL: ${{ steps.site.outputs.url }}
          INTENSIVE: ${{ steps.mode.outputs.intensive }}
          TZ: Asia/Tokyo
        run: python runner.py

      - name: Commit state and site if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true

          # 変更があるかチェック
          if [ -n "$(git status --porcelain)" ]; then
            git add state.json docs/
            git commit -m "Update news and site [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin ${{ github.ref_name }} && \
                git push && break || sleep 5
            done
          else
            echo "No changes"
          fi
